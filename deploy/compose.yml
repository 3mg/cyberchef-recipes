name: cyberchef-recipes
services:
  recipes:
    image: nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    container_name: nomad_cyberchef_recipes
    restart: unless-stopped
    user: '101:101'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['${NOMAD_LAN_IP:-127.0.0.1}:8101:8080']
    command: [nginx, -g, 'daemon off;']
    volumes:
      - ../site:/site:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs: ['/tmp:size=16m,mode=1777']
    mem_limit: 64m
    cpus: 0.5
