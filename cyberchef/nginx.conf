server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Revalidate HTML, workers and operation modules on subsequent visits.
    # ETag/Last-Modified still allow unchanged assets to return 304.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
